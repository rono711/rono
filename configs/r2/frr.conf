frr defaults traditional
hostname R2
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.12.2/30
!
interface eth2
 ip address 10.0.23.1/30
!
interface eth3
 ip address 10.0.24.1/30
!
interface eth4
 ip address 10.0.25.1/30
!
interface lo
 ip address 10.102.0.1/24
!
router bgp 65002
 bgp router-id 10.102.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.23.2 remote-as 65003
 neighbor 10.0.24.2 remote-as 65004
 neighbor 10.0.25.2 remote-as 65005
 !
 address-family ipv4 unicast
  network 10.102.0.0/24
  neighbor 10.0.12.1 activate
  neighbor 10.0.23.2 activate
  neighbor 10.0.24.2 activate
  neighbor 10.0.25.2 activate
 exit-address-family
!
