frr defaults traditional
hostname R6
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.36.2/30
!
interface eth2
 ip address 10.0.56.2/30
!
interface lo
 ip address 10.106.0.1/24
!
router bgp 65006
 bgp router-id 10.106.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.36.1 remote-as 65003
 neighbor 10.0.56.1 remote-as 65005
 !
 address-family ipv4 unicast
  network 10.106.0.0/24
  neighbor 10.0.36.1 activate
  neighbor 10.0.56.1 activate
 exit-address-family
!
