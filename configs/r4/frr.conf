frr defaults traditional
hostname R4-VICTIM
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.24.2/30
!
interface lo
 ip address 10.104.0.1/24
!
router bgp 65004
 bgp router-id 10.104.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.24.1 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.104.0.0/24
  neighbor 10.0.24.1 activate
 exit-address-family
!
