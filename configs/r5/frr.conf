frr defaults traditional
hostname R5
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.25.2/30
!
interface eth2
 ip address 10.0.56.1/30
!
interface lo
 ip address 10.105.0.1/24
!
router bgp 65005
 bgp router-id 10.105.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.25.1 remote-as 65002
 neighbor 10.0.56.2 remote-as 65006
 !
 address-family ipv4 unicast
  network 10.105.0.0/24
  neighbor 10.0.25.1 activate
  neighbor 10.0.56.2 activate
 exit-address-family
!
