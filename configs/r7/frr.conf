frr defaults traditional
hostname R7-ATTACKER
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.37.2/30
!
interface lo
 ip address 10.107.0.1/24
!
router bgp 65007
 bgp router-id 10.107.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.37.1 remote-as 65003
 !
 address-family ipv4 unicast
  network 10.107.0.0/24
  neighbor 10.0.37.1 activate
 exit-address-family
!
