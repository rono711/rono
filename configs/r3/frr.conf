frr defaults traditional
hostname R3
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.13.2/30
!
interface eth2
 ip address 10.0.23.2/30
!
interface eth3
 ip address 10.0.36.1/30
!
interface eth4
 ip address 10.0.37.1/30
!
interface lo
 ip address 10.103.0.1/24
!
router bgp 65003
 bgp router-id 10.103.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.13.1 remote-as 65001
 neighbor 10.0.23.1 remote-as 65002
 neighbor 10.0.36.2 remote-as 65006
 neighbor 10.0.37.2 remote-as 65007
 !
 address-family ipv4 unicast
  network 10.103.0.0/24
  neighbor 10.0.13.1 activate
  neighbor 10.0.23.1 activate
  neighbor 10.0.36.2 activate
  neighbor 10.0.37.2 activate
 exit-address-family
!
