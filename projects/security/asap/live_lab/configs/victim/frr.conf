frr defaults traditional
hostname sec-victim
service integrated-vtysh-config
!
interface eth1
 ip address 10.222.3.2/30
!
interface lo
 ip address 192.0.2.1/24
!
ip prefix-list VICTIM seq 5 permit 192.0.2.0/24
route-map CUSTOMER-IN permit 10
 set local-preference 200
!
route-map PROVIDER-IN permit 10
 set local-preference 100
!
router bgp 65169
 bgp router-id 10.255.22.5
 no bgp ebgp-requires-policy
 bgp enforce-first-as
 neighbor 10.222.3.1 remote-as 65003
 address-family ipv4 unicast
  network 192.0.2.0/24
  neighbor 10.222.3.1 route-map PROVIDER-IN in
 exit-address-family
!
line vty
!
