frr defaults traditional
hostname sec-leaker
service integrated-vtysh-config
!
interface eth1
 ip address 10.222.4.2/30
!
interface eth2
 ip address 10.222.5.2/30
!
ip prefix-list VICTIM seq 5 permit 192.0.2.0/24
route-map CUSTOMER-IN permit 10
 set local-preference 200
!
route-map PROVIDER-IN permit 10
 set local-preference 100
!
route-map NO-LEAK deny 10
 match ip address prefix-list VICTIM
route-map NO-LEAK permit 100
!
router bgp 65066
 bgp router-id 10.255.22.4
 no bgp ebgp-requires-policy
 bgp enforce-first-as
 neighbor 10.222.4.1 remote-as 65002
 neighbor 10.222.5.1 remote-as 65003
 address-family ipv4 unicast
  neighbor 10.222.4.1 route-map PROVIDER-IN in
  neighbor 10.222.4.1 route-map NO-LEAK out
  neighbor 10.222.5.1 route-map PROVIDER-IN in
 exit-address-family
!
line vty
!
