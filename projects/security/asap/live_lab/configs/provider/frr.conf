frr defaults traditional
hostname sec-provider
service integrated-vtysh-config
!
interface eth1
 ip address 10.222.2.2/30
!
interface eth2
 ip address 10.222.3.1/30
!
interface eth3
 ip address 10.222.5.1/30
!
ip prefix-list VICTIM seq 5 permit 192.0.2.0/24
route-map CUSTOMER-IN permit 10
 set local-preference 200
!
route-map PROVIDER-IN permit 10
 set local-preference 100
!
router bgp 65003
 bgp router-id 10.255.22.3
 no bgp ebgp-requires-policy
 bgp enforce-first-as
 neighbor 10.222.2.1 remote-as 65001
 neighbor 10.222.3.2 remote-as 65169
 neighbor 10.222.5.2 remote-as 65066
 address-family ipv4 unicast
  neighbor 10.222.2.1 route-map PROVIDER-IN in
  neighbor 10.222.3.2 route-map CUSTOMER-IN in
  neighbor 10.222.5.2 route-map CUSTOMER-IN in
 exit-address-family
!
line vty
!
